<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Belangrijkste stappen om een woning te verkopen</title>
  <desc id="desc">Van waardebepaling en verkoopdocumenten via publicatie en biedingen naar het compromis en de notariële akte.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a4a"/>
      <stop offset="1" stop-color="#184a82"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" rx="28" fill="url(#bg)"/>
  <text x="52" y="68" fill="#ffbd2e" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">VERKOOPROUTE</text>
  <text x="52" y="116" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Van schatting naar notariële akte</text>
  <path d="M106 292h688" stroke="#ffbd2e" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif">
    <g transform="translate(106 292)">
      <circle r="42" fill="#ffbd2e"/>
      <text y="10" text-anchor="middle" fill="#071a4a" font-size="30" font-weight="800">1</text>
      <text y="88" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Schatten</text>
      <text y="118" text-anchor="middle" fill="#c9d8ee" font-size="17">waarde en doel</text>
    </g>
    <g transform="translate(278 292)">
      <circle r="42" fill="#fff"/>
      <text y="10" text-anchor="middle" fill="#071a4a" font-size="30" font-weight="800">2</text>
      <text y="88" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Attesten</text>
      <text y="118" text-anchor="middle" fill="#c9d8ee" font-size="17">dossier opbouwen</text>
    </g>
    <g transform="translate(450 292)">
      <circle r="42" fill="#fff"/>
      <text y="10" text-anchor="middle" fill="#071a4a" font-size="30" font-weight="800">3</text>
      <text y="88" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Publiceren</text>
      <text y="118" text-anchor="middle" fill="#c9d8ee" font-size="17">markt en bezoeken</text>
    </g>
    <g transform="translate(622 292)">
      <circle r="42" fill="#fff"/>
      <text y="10" text-anchor="middle" fill="#071a4a" font-size="30" font-weight="800">4</text>
      <text y="88" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Bod</text>
      <text y="118" text-anchor="middle" fill="#c9d8ee" font-size="17">voorwaarden checken</text>
    </g>
    <g transform="translate(794 292)">
      <circle r="42" fill="#ffbd2e"/>
      <text y="10" text-anchor="middle" fill="#071a4a" font-size="30" font-weight="800">5</text>
      <text y="88" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Akte</text>
      <text y="118" text-anchor="middle" fill="#c9d8ee" font-size="17">notariële afronding</text>
    </g>
  </g>

  <rect x="98" y="478" width="704" height="72" rx="18" fill="#ffbd2e"/>
  <text x="450" y="508" text-anchor="middle" fill="#071a4a" font-family="Arial, sans-serif" font-size="21" font-weight="700">Laat bod en compromis vooraf controleren</text>
  <text x="450" y="536" text-anchor="middle" fill="#071a4a" font-family="Arial, sans-serif" font-size="18">Een akkoord over pand en prijs kan juridisch bindend zijn.</text>
</svg>
