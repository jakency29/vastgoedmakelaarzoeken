<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Richtprijzen en prijsfactoren voor een asbestattest in 2026</title>
  <desc id="desc">Een appartement kost gemiddeld vierhonderd tot vierhonderdvijftig euro en een woning vijfhonderd tot vijfhonderdvijftig euro. Complexiteit en staalnames beïnvloeden de prijs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a4a"/>
      <stop offset="1" stop-color="#16457f"/>
    </linearGradient>
  </defs>
  <rect width="900" height="600" rx="28" fill="url(#bg)"/>
  <text x="52" y="68" fill="#ffbd2e" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">RICHTPRIJZEN 2026</text>
  <text x="52" y="116" fill="#fff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Wat bepaalt de prijs?</text>

  <g font-family="Arial, sans-serif">
    <rect x="52" y="151" width="384" height="140" rx="22" fill="#fff"/>
    <text x="82" y="197" fill="#071a4a" font-size="24" font-weight="700">Appartement</text>
    <text x="82" y="253" fill="#071a4a" font-size="38" font-weight="800">€ 400 tot € 450</text>

    <rect x="464" y="151" width="384" height="140" rx="22" fill="#fff"/>
    <text x="494" y="197" fill="#071a4a" font-size="24" font-weight="700">Gezinswoning</text>
    <text x="494" y="253" fill="#071a4a" font-size="38" font-weight="800">€ 500 tot € 550</text>
  </g>

  <text x="52" y="340" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Belangrijkste prijsfactoren</text>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#071a4a">
    <rect x="52" y="366" width="182" height="84" rx="18" fill="#ffbd2e"/>
    <text x="143" y="401" text-anchor="middle">Woningtype</text>
    <text x="143" y="427" text-anchor="middle">en omvang</text>

    <rect x="257" y="366" width="182" height="84" rx="18" fill="#ffbd2e"/>
    <text x="348" y="401" text-anchor="middle">Aantal</text>
    <text x="348" y="427" text-anchor="middle">inspectiezones</text>

    <rect x="462" y="366" width="182" height="84" rx="18" fill="#ffbd2e"/>
    <text x="553" y="401" text-anchor="middle">Staalnames</text>
    <text x="553" y="427" text-anchor="middle">en labo</text>

    <rect x="667" y="366" width="181" height="84" rx="18" fill="#ffbd2e"/>
    <text x="757" y="401" text-anchor="middle">Verplaatsing</text>
    <text x="757" y="427" text-anchor="middle">en offerte</text>
  </g>

  <rect x="52" y="490" width="796" height="72" rx="18" fill="#fff" opacity=".96"/>
  <text x="450" y="520" text-anchor="middle" fill="#071a4a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Totale marktprijzen: € 350 tot € 900</text>
  <text x="450" y="546" text-anchor="middle" fill="#52647d" font-family="Arial, sans-serif" font-size="17">Geen wettelijk tarief. Controleer of de OVAM-retributie is inbegrepen.</text>
</svg>
