<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Privatief appartement en gemene delen</title>
  <desc id="desc">Appartementgebouw met afzonderlijke verantwoordelijkheden voor de eigenaar en de vereniging van mede-eigenaars.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#081543" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="32" fill="#eef1fb"/>
  <text x="70" y="82" fill="#081543" font-family="Arial, sans-serif" font-size="38" font-weight="700">Appartement: twee verschillende attestzones</text>
  <text x="70" y="121" fill="#3350ab" font-family="Arial, sans-serif" font-size="20">Het privatieve deel en de gemene delen hebben elk een eigen verantwoordelijkheid.</text>

  <g transform="translate(90 175)" filter="url(#shadow)">
    <rect x="0" y="55" width="475" height="340" rx="18" fill="#ffffff" stroke="#b8c4ec" stroke-width="3"/>
    <path d="M-18 60L238 0l255 60" fill="#182c6f" stroke="#081543" stroke-width="4" stroke-linejoin="round"/>
    <rect x="42" y="98" width="165" height="105" rx="12" fill="#ffd47a" stroke="#f9a41a" stroke-width="3"/>
    <rect x="268" y="98" width="165" height="105" rx="12" fill="#dbe1f5" stroke="#8ba0dd" stroke-width="3"/>
    <rect x="42" y="240" width="165" height="105" rx="12" fill="#dbe1f5" stroke="#8ba0dd" stroke-width="3"/>
    <rect x="268" y="240" width="165" height="105" rx="12" fill="#dbe1f5" stroke="#8ba0dd" stroke-width="3"/>
    <rect x="219" y="75" width="37" height="320" fill="#182c6f"/>
    <text x="124" y="145" text-anchor="middle" fill="#081543" font-family="Arial, sans-serif" font-size="20" font-weight="700">Privatief</text>
    <text x="124" y="174" text-anchor="middle" fill="#081543" font-family="Arial, sans-serif" font-size="16">appartement</text>
    <text x="238" y="427" text-anchor="middle" fill="#3350ab" font-family="Arial, sans-serif" font-size="17">Gangen, dak, kelder en technieken zijn gemeenschappelijk</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="650" y="185" width="460" height="180" rx="24" fill="#ffffff" stroke="#f9a41a" stroke-width="3"/>
    <circle cx="710" cy="245" r="30" fill="#ffd47a"/>
    <path d="M696 247l10 10 20-24" fill="none" stroke="#081543" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="760" y="236" fill="#081543" font-size="25" font-weight="700">Privatief attest</text>
    <text x="760" y="270" fill="#3350ab" font-size="18">Verantwoordelijke: eigenaar of verkoper</text>
    <text x="690" y="316" fill="#182c6f" font-size="18">Beschrijft de verkochte privatieve eenheid.</text>

    <rect x="650" y="405" width="460" height="180" rx="24" fill="#ffffff" stroke="#8ba0dd" stroke-width="3"/>
    <circle cx="710" cy="465" r="30" fill="#dbe1f5"/>
    <path d="M696 467l10 10 20-24" fill="none" stroke="#081543" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="760" y="456" fill="#081543" font-size="25" font-weight="700">Attest gemene delen</text>
    <text x="760" y="490" fill="#3350ab" font-size="18">Verantwoordelijke: VME via de syndicus</text>
    <text x="690" y="536" fill="#182c6f" font-size="18">Afzonderlijk verplicht vanaf 1 januari 2027.</text>
  </g>

  <text x="70" y="635" fill="#5670c7" font-family="Arial, sans-serif" font-size="16">Vraag bij verkoop beide informatielijnen na. Het ene attest vervangt het andere niet automatisch.</text>
</svg>
