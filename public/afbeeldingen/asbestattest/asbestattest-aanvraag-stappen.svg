<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Van opdracht tot officieel asbestattest</title>
  <desc id="desc">Procesdiagram met opdracht, plaatsbezoek, materiaalonderzoek, OVAM-registratie en aflevering.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#081543" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f9a41a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="32" fill="#081543"/>
  <path d="M0 540 C250 430 420 650 700 535 C915 445 1050 480 1200 415 L1200 675 L0 675 Z" fill="#182c6f"/>
  <text x="70" y="82" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Van opdracht tot officieel asbestattest</text>
  <text x="70" y="121" fill="#b8c4ec" font-family="Arial, sans-serif" font-size="20">De deskundige verbindt bronnen, terreinbevindingen en OVAM-registratie.</text>

  <g stroke="#f9a41a" stroke-width="5" marker-end="url(#arrow)">
    <line x1="263" y1="322" x2="292" y2="322"/>
    <line x1="483" y1="322" x2="512" y2="322"/>
    <line x1="703" y1="322" x2="732" y2="322"/>
    <line x1="923" y1="322" x2="952" y2="322"/>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(55 190)">
      <rect width="208" height="265" rx="24" fill="#ffffff"/>
      <circle cx="104" cy="70" r="40" fill="#eef1fb"/>
      <path d="M82 72h44M90 57h28M94 87h20" stroke="#3350ab" stroke-width="6" stroke-linecap="round"/>
      <text x="104" y="143" text-anchor="middle" fill="#081543" font-size="22" font-weight="700">1. Opdracht</text>
      <text x="104" y="177" text-anchor="middle" fill="#3350ab" font-size="17">Scope en documenten</text>
      <text x="104" y="204" text-anchor="middle" fill="#3350ab" font-size="17">worden vastgelegd</text>
    </g>
    <g transform="translate(275 190)">
      <rect width="208" height="265" rx="24" fill="#ffffff"/>
      <circle cx="104" cy="70" r="40" fill="#eef1fb"/>
      <path d="M78 78l26-24 26 24v23H78zM94 101V82h20v19" fill="none" stroke="#3350ab" stroke-width="5" stroke-linejoin="round"/>
      <text x="104" y="143" text-anchor="middle" fill="#081543" font-size="22" font-weight="700">2. Bezoek</text>
      <text x="104" y="177" text-anchor="middle" fill="#3350ab" font-size="17">Ruimtes en constructies</text>
      <text x="104" y="204" text-anchor="middle" fill="#3350ab" font-size="17">worden onderzocht</text>
    </g>
    <g transform="translate(495 190)">
      <rect width="208" height="265" rx="24" fill="#ffffff"/>
      <circle cx="104" cy="70" r="40" fill="#eef1fb"/>
      <path d="M89 47h30M99 47v23L84 94c-4 7 1 13 9 13h22c8 0 13-6 9-13l-15-24V47" fill="none" stroke="#3350ab" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="143" text-anchor="middle" fill="#081543" font-size="22" font-weight="700">3. Analyse</text>
      <text x="104" y="177" text-anchor="middle" fill="#3350ab" font-size="17">Verdachte materialen</text>
      <text x="104" y="204" text-anchor="middle" fill="#3350ab" font-size="17">worden beoordeeld</text>
    </g>
    <g transform="translate(715 190)">
      <rect width="208" height="265" rx="24" fill="#ffffff"/>
      <circle cx="104" cy="70" r="40" fill="#eef1fb"/>
      <ellipse cx="104" cy="54" rx="26" ry="10" fill="none" stroke="#3350ab" stroke-width="5"/>
      <path d="M78 54v34c0 6 12 10 26 10s26-4 26-10V54M78 71c0 6 12 10 26 10s26-4 26-10" fill="none" stroke="#3350ab" stroke-width="5"/>
      <text x="104" y="143" text-anchor="middle" fill="#081543" font-size="22" font-weight="700">4. Registratie</text>
      <text x="104" y="177" text-anchor="middle" fill="#3350ab" font-size="17">Gegevens gaan naar</text>
      <text x="104" y="204" text-anchor="middle" fill="#3350ab" font-size="17">de OVAM-databank</text>
    </g>
    <g transform="translate(935 190)">
      <rect width="208" height="265" rx="24" fill="#ffffff"/>
      <circle cx="104" cy="70" r="40" fill="#ffd47a"/>
      <path d="M83 45h34l12 12v51H83zM117 45v14h12M92 77h28M92 91h20" fill="none" stroke="#081543" stroke-width="5" stroke-linejoin="round"/>
      <text x="104" y="143" text-anchor="middle" fill="#081543" font-size="22" font-weight="700">5. Attest</text>
      <text x="104" y="177" text-anchor="middle" fill="#3350ab" font-size="17">Conclusie, risico's en</text>
      <text x="104" y="204" text-anchor="middle" fill="#3350ab" font-size="17">maatregelen beschikbaar</text>
    </g>
  </g>

  <rect x="205" y="515" width="790" height="84" rx="22" fill="#eef1fb"/>
  <text x="600" y="550" text-anchor="middle" fill="#081543" font-family="Arial, sans-serif" font-size="21" font-weight="700">De bezoekdatum is niet automatisch de opleverdatum.</text>
  <text x="600" y="579" text-anchor="middle" fill="#3350ab" font-family="Arial, sans-serif" font-size="17">Monsternames, labo-analyse en volledigheid van gegevens beïnvloeden de planning.</text>
</svg>
